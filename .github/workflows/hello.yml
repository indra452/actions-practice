name: Hello

on:
  push:
    branches: [main]

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from the robot. Commit $GITHUB_SHA"

      - name: Show the files it downloaded
        run: ls -la
